apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-smoke
  namespace: cortex-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-smoke
  template:
    metadata:
      labels:
        app: ingress-smoke
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-smoke
  namespace: cortex-apps
spec:
  selector:
    app: ingress-smoke
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-smoke
  namespace: cortex-apps
spec:
  ingressClassName: traefik
  rules:
    - host: cortex.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingress-smoke
                port:
                  number: 80
